<abp-page [title]="'🍽️ Booking Menu Options'">
  <!-- Toolbar -->
  <abp-page-toolbar-container class="col">
    <div class="text-end">
      <button class="btn btn-outline-primary btn-sm" type="button" (click)="create()">
        ➕ Add New
      </button>
    </div>
  </abp-page-toolbar-container>

  <!-- SEARCH + FILTER -->
  <div class="card">
    <div class="card-body">
      <div class="row mb-2">
        <div class="col-10">
          <div class="input-group">
            <input class="form-control" placeholder="Search Here" [(ngModel)]="filters.filter" />
            <button class="btn btn-primary" (click)="list.get()">
              <i class="fas fa-magnifying-glass"></i>
            </button>
          </div>
        </div>

        <div class="col-2 text-end">
          <button class="btn btn-outline-info w-100" (click)="showFilter = !showFilter">
            <i class="fas fa-sliders me-1"></i>
            Filters <i class="fas" [ngClass]="showFilter ? 'fa-angle-up' : 'fa-angle-down'"></i>
          </button>
        </div>
      </div>

      <!-- FILTER PANEL -->
      <div *ngIf="showFilter" class="mt-3">
        <div class="row g-2">
          <div class="col-sm-4">
            <label><i class="fas fa-calendar me-1"></i> Booking</label>
            <select class="form-control form-control-sm" [(ngModel)]="filters.bookingId">
              <option [ngValue]="null">Select Booking</option>
              <option *ngFor="let b of bookingsList" [ngValue]="b.id">
                {{ b.eventType }} - {{ b.eventDate | date:'yyyy-MM-dd' }}
              </option>
            </select>
          </div>

          <div class="col-sm-4">
            <label><i class="fas fa-utensils me-1"></i> Menu Item</label>
            <select class="form-control form-control-sm" [(ngModel)]="filters.menuItemId">
              <option [ngValue]="null">Select Menu Item</option>
              <option *ngFor="let m of menuItemsList" [ngValue]="m.id">{{ m.name }}</option>
            </select>
          </div>

          <div class="col-sm-auto d-flex align-items-end gap-1">
            <button class="btn btn-sm btn-outline-secondary" (click)="clearFilters()">
              <i class="fas fa-undo"></i> Reset
            </button>

            <button type="button" class="btn btn-success btn-sm" (click)="list.get()">
              <i class="fa fa-filter"></i> Apply
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="card mt-2">
    <div class="card-body">
      <ngx-datatable
        [rows]="items.items"
        [count]="items.totalCount"
        [list]="list"
        columnMode="standard"
        default
      >
        <!-- ACTIONS -->
        <ngx-datatable-column name="Actions" [maxWidth]="250" [sortable]="false">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div ngbDropdown container="body">
              <button class="btn btn-primary btn-sm dropdown-toggle" ngbDropdownToggle>
                <i class="fas fa-gear me-1"></i>
                Actions
              </button>
              <div ngbDropdownMenu>
                <button ngbDropdownItem (click)="edit(row.id)">
                  <i class="fas fa-edit me-2 text-info"></i> Edit
                </button>
                <button class="text-danger" ngbDropdownItem (click)="delete(row.id)">
                  <i class="fas fa-trash me-2"></i> Delete
                </button>
              </div>
            </div>
          </ng-template>
        </ngx-datatable-column>

        <!-- DATA -->
        <ngx-datatable-column prop="quantity" [width]="120">
          <ng-template ngx-datatable-header-template>
            <i class="fas fa-sort-numeric-up me-1"></i> Quantity
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column prop="priceAtBookingTime" [width]="220">
          <ng-template ngx-datatable-header-template>
            <i class="fas fa-money-bill-wave me-1"></i> Price at booking time
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column prop="bookingInfo" [width]="250">
          <ng-template ngx-datatable-header-template>
            <i class="fas fa-calendar-check me-1"></i> Booking Info
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column prop="menuItemName" [width]="180">
          <ng-template ngx-datatable-header-template>
            <i class="fas fa-utensils me-1"></i> Menu Item
          </ng-template>
        </ngx-datatable-column>
      </ngx-datatable>
    </div>
  </div>
</abp-page>

<!-- MODAL -->
<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <i class="fas fa-calendar-check text-success"></i>
    <h3>{{ selected.id ? 'Edit' : 'New' }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label"><i class="fas fa-sort-numeric-up me-1"></i> Quantity *</label>
          <input type="number" class="form-control" formControlName="quantity" />
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label"
            ><i class="fas fa-money-bill me-1"></i> Price At Booking Time *</label
          >
          <input type="number" class="form-control" formControlName="priceAtBookingTime" />
        </div>

        <!-- Booking -->
        <div class="col-md-6 mb-3">
          <label>Booking *</label>
          <select class="form-control" formControlName="bookingId">
            <option [ngValue]="null">Select Booking</option>
            <option *ngFor="let b of bookingsList" [ngValue]="b.id">
              {{ b.eventType }} - {{ b.eventDate | date:'yyyy-MM-dd' }}
            </option>
          </select>
        </div>

        <!-- Menu Item -->
        <div class="col-md-6 mb-3">
          <label>Menu Item *</label>
          <select class="form-control" formControlName="menuItemId">
            <option [ngValue]="null">Select Menu Item</option>
            <option *ngFor="let m of menuItemsList" [ngValue]="m.id">{{ m.name }}</option>
          </select>
        </div>
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button class="btn btn-secondary" (click)="isModalOpen=false">
      <i class="fas fa-xmark me-1"></i>Cancel
    </button>
    <button class="btn btn-success" (click)="save()" [disabled]="form.invalid">
      <i class="fas fa-floppy-disk me-1"></i> Save
    </button>
  </ng-template>
</abp-modal>
