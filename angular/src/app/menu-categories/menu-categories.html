<abp-page [title]="'📂 Menu Categories'">
  <!-- Toolbar -->
  <abp-page-toolbar-container class="col">
    <div class="text-end">
      <button
        id="create"
        class="btn btn-outline-primary btn-sm"
        type="button"
        (click)="createMenuCategory()"
      >
        ➕ Add New
      </button>
    </div>
  </abp-page-toolbar-container>

  <!-- Search + Filters -->
  <div class="card">
    <div class="card-body">
      <!-- Top Row -->
      <div class="row mb-2">
        <div class="col-10">
          <div class="input-group">
            <input
              type="text"
              class="form-control"
              placeholder="Search Here"
              [(ngModel)]="filters.filter"
            />
            <button type="button" class="btn btn-primary" (click)="list.get()">
              <i class="fas fa-magnifying-glass"></i>
            </button>
          </div>
        </div>

        <div class="col-2 text-end">
          <button class="btn btn-outline-info w-100" (click)="showFilter = !showFilter">
            <i class="fas fa-sliders me-1"></i>
            Filters <i class="fas" [ngClass]="showFilter ? 'fa-angle-up' : 'fa-angle-down'"></i>
          </button>
        </div>
      </div>

      <!-- Filter Panel -->
      <div *ngIf="showFilter" class="mt-3">
        <div class="row g-2">
          <!-- Name -->
          <div class="col-sm-4">
            <label> <i class="fas fa-tag me-1 text-warning"></i> Name</label>
            <input class="form-control form-control-sm" [(ngModel)]="filters.name" />
          </div>

          <!-- Buttons -->
          <div class="col-sm-auto d-flex align-items-end gap-1">
            <button type="button" class="btn btn-sm btn-outline-secondary" (click)="clearFilters()">
              <i class="fas fa-undo"></i> Reset
            </button>

            <button type="button" class="btn btn-success btn-sm" (click)="list.get()">
              <i class="fa fa-filter"></i> Apply
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="card mt-2">
    <div class="card-body">
      <ngx-datatable
        [rows]="menuCategories.items"
        [count]="menuCategories.totalCount"
        [list]="list"
        default
      >
        <!-- ACTIONS -->
        <ngx-datatable-column name="Actions" [maxWidth]="150" [sortable]="false">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div ngbDropdown container="body">
              <button class="btn btn-sm btn-gradient dropdown-toggle"  ngbDropdownToggle>
                <i class="fas fa-gear me-1"></i>
                Actions
              </button>
              <div ngbDropdownMenu>
                <button ngbDropdownItem (click)="editMenuCategory(row.id)">
                  <i class="fas fa-edit me-2 text-info"></i> Edit
                </button>
                <button class="text-danger" ngbDropdownItem (click)="delete(row.id)">
                  <i class="fas fa-trash me-2"></i> Delete
                </button>
              </div>
            </div>
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column prop="name" [maxWidth]="250">
  <ng-template ngx-datatable-header-template>
    <i class="fas fa-tag me-1 text-warning"></i>
    Name
  </ng-template>
</ngx-datatable-column>

<ngx-datatable-column prop="description">
  <ng-template ngx-datatable-header-template>
    <i class="fas fa-align-left me-1 text-primary"></i>
    Description
  </ng-template>
</ngx-datatable-column>
      </ngx-datatable>
    </div>
  </div>
</abp-page>

<!-- MODAL -->
<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <i class="fas fa-calendar-check text-success"></i>
    <h3>{{ selectedMenuCategory.id ? 'Edit' : 'New' }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Name *</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fas fa-layer-group"></i>
            </span>

            <input class="form-control" formControlName="name" />
          </div>
        </div>

        <div class="col-md-12 mb-3">
          <label class="form-label">Description</label>
          <div class="position-relative">
            <i class="fas fa-align-left textarea-icon"></i>

            <textarea class="form-control ps-5" formControlName="description" rows="3"></textarea>
          </div>
        </div>
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button class="btn btn-outline-secondary" (click)="isModalOpen=false">
      <i class="fas fa-xmark me-1"></i> Cancel
    </button>
    <button class="btn btn-success" (click)="save()" [disabled]="form.invalid">
      <i class="fas fa-floppy-disk me-1"></i> Save
    </button>
  </ng-template>
</abp-modal>
