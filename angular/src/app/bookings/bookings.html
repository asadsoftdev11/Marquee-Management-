<abp-page [title]="'📅 Bookings'">
  <!-- Toolbar -->
  <abp-page-toolbar-container class="col">
    <div class="text-end">
      <button class="btn btn-outline-primary btn-sm" (click)="createBooking()">➕ Add New</button>
    </div>
  </abp-page-toolbar-container>

  <!-- Search + Filters -->
  <div class="card">
    <div class="card-body">
      <div class="row mb-2">
        <div class="col-10">
          <div class="input-group">
            <input class="form-control" placeholder="Search Here" [(ngModel)]="filters.filter" />
            <button class="btn btn-primary" (click)="list.get()">
              <i class="fas fa-magnifying-glass"></i>
            </button>
          </div>
        </div>

        <div class="col-2 text-end">
          <button class="btn btn-outline-info w-100" (click)="showFilter = !showFilter">
            <i class="fas fa-sliders me-1"></i>
            Filters <i class="fas" [ngClass]="showFilter ? 'fa-angle-up' : 'fa-angle-down'"></i>
          </button>
        </div>
      </div>

      <!-- Filters -->
      <div *ngIf="showFilter" class="mt-3">
        <div class="row g-2">
          <div class="col-sm-4">
            <label><i class="fas fa-calendar-days me-1 text-warning"></i> Event Type</label>
            <input class="form-control form-control-sm" [(ngModel)]="filters.eventType" />
          </div>

          <div class="col-sm-4">
            <label><i class="fas fa-signal me-1 text-info"></i> Status</label>
            <select class="form-control form-control-sm" [(ngModel)]="filters.status">
              <option [ngValue]="null">All</option>
              <option [ngValue]="0">Pending</option>
              <option [ngValue]="1">Confirmed</option>
              <option [ngValue]="2">Cancelled</option>
              <option [ngValue]="3">Completed</option>
            </select>
          </div>

          <div class="col-sm-auto d-flex align-items-end gap-1">
            <button class="btn btn-sm btn-outline-secondary" (click)="clearFilters()">
              <i class="fas fa-undo"></i> Reset
            </button>
            <button type="button" class="btn btn-success btn-sm" (click)="list.get()">
              <i class="fa fa-filter"></i> Apply
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="card mt-2">
    <div class="card-body">
      <ngx-datatable [rows]="bookings.items" [count]="bookings.totalCount" [list]="list" default>
        <ngx-datatable-column name="Actions" [maxWidth]="150" [sortable]="false">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div ngbDropdown container="body">
              <button class="btn btn-primary btn-sm dropdown-toggle" ngbDropdownToggle>
                <i class="fas fa-gear me-1"></i> Actions
              </button>
              <div ngbDropdownMenu>
                <button ngbDropdownItem (click)="editBooking(row.id)">
                  <i class="fas fa-edit me-2 text-info"></i> Edit
                </button>
                <button class="text-danger" ngbDropdownItem (click)="delete(row.id)">
                  <i class="fas fa-trash me-2"></i> Delete
                </button>
              </div>
            </div>
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column name="Event Date">
          <ng-template ngx-datatable-header-template>
            <i class="fas fa-calendar-days me-1 text-warning"></i>
            Event Date
          </ng-template>
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.eventDate | date:'yyyy-MM-dd' }}
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column prop="eventType">
          <ng-template ngx-datatable-header-template>
            <i class="fas fa-champagne-glasses me-1 text-primary"></i>
            Event Type
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column prop="guestCount">
          <ng-template ngx-datatable-header-template>
            <i class="fas fa-users me-1 text-success"></i>
            Guest Count
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column prop="totalAmount">
          <ng-template ngx-datatable-header-template>
            <i class="fas fa-money-bill-wave me-1 text-danger"></i>
            Total Amount
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column prop="marqueeName">
          <ng-template ngx-datatable-header-template>
            <i class="fas fa-hotel me-1 text-info"></i>
            Marquee
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column prop="customerName">
          <ng-template ngx-datatable-header-template>
            <i class="fas fa-user me-1 text-warning"></i>
            Customer
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column name="Status">
          <ng-template ngx-datatable-header-template>
            <i class="fas fa-signal me-1 text-success"></i>
            Status
          </ng-template>

          <ng-template let-row="row" ngx-datatable-cell-template>
            <span class="badge bg-warning" *ngIf="row.status === 0">
              <i class="fas fa-clock me-1"></i> Pending
            </span>

            <span class="badge bg-success" *ngIf="row.status === 1">
              <i class="fas fa-check me-1"></i> Confirmed
            </span>

            <span class="badge bg-danger" *ngIf="row.status === 2">
              <i class="fas fa-xmark me-1"></i> Cancelled
            </span>

            <span class="badge bg-primary" *ngIf="row.status === 3">
              <i class="fas fa-circle-check me-1"></i> Completed
            </span>
          </ng-template>
        </ngx-datatable-column>
      </ngx-datatable>
    </div>
  </div>
</abp-page>

<!-- MODAL -->
<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <i class="fas fa-calendar-check text-success"></i>
    <h3>{{ selectedBooking.id ? 'Edit' : 'New' }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Event Date *</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fas fa-calendar-days"></i>
            </span>

            <input type="date" class="form-control" formControlName="eventDate" />
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label>Event Type *</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fas fa-champagne-glasses"></i>
            </span>

            <input class="form-control" formControlName="eventType" />
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label>Guest Count *</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fas fa-users"></i>
            </span>

            <input type="number" class="form-control" formControlName="guestCount" />
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label> <i class="fas fa-signal me-1 text-success"></i> Status *</label>
          <select class="form-control" formControlName="status">
            <option [ngValue]="0">Pending</option>
            <option [ngValue]="1">Confirmed</option>
            <option [ngValue]="2">Cancelled</option>
            <option [ngValue]="3">Completed</option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label>Total Amount *</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fas fa-money-bill-wave"></i>
            </span>

            <input type="number" class="form-control" formControlName="totalAmount" />
          </div>
        </div>

        <!-- Marquee -->
        <div class="col-md-6 mb-3">
          <label>Marquee *</label>
          <select class="form-control" formControlName="marqueeId">
            <option [ngValue]="null">Select Marquee</option>
            <option *ngFor="let m of marquees" [ngValue]="m.id">{{ m.name }}</option>
          </select>
        </div>

        <!-- Customer -->
        <div class="col-md-6 mb-3">
          <label>Customer *</label>
          <select class="form-control" formControlName="customerId">
            <option [ngValue]="null">Select Customer</option>
            <option *ngFor="let c of customers" [ngValue]="c.id">{{ c.name }}</option>
          </select>
        </div>
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button class="btn btn-secondary" (click)="isModalOpen=false">
      <i class="fas fa-xmark me-1"></i> Cancel
    </button>
    <button class="btn btn-success" (click)="save()" [disabled]="form.invalid">
      <i class="fas fa-floppy-disk me-1"></i> Save
    </button>
  </ng-template>
</abp-modal>
