<abp-page [title]="'👥 Customers'">
  <abp-page-toolbar-container class="col">
    <div class="text-end">
      <button class="btn btn-outline-primary btn-sm" (click)="createCustomer()">➕ Add New</button>
    </div>
  </abp-page-toolbar-container>

  <div class="card">
    <div class="card-body">
      <div class="row mb-2">
        <div class="col-10">
          <div class="input-group">
            <input class="form-control" placeholder="Search Here" [(ngModel)]="filters.filter" />
            <button class="btn btn-primary" (click)="list.get()">
              <i class="fa fa-search"></i>
            </button>
          </div>
        </div>
        <div class="col-2 text-end">
          <button class="btn btn-outline-info w-100" (click)="showFilter = !showFilter">
            <i class="fas fa-sliders me-1"></i>
            Filters <i class="fas" [ngClass]="showFilter ? 'fa-angle-up' : 'fa-angle-down'"></i>
          </button>
        </div>
      </div>

      <div *ngIf="showFilter" class="mt-3">
        <div class="row g-2">
          <div class="col-sm-4">
            <label>Name</label>
            <input class="form-control form-control-sm" [(ngModel)]="filters.name" />
          </div>
          <div class="col-sm-4">
            <label>Email</label>
            <input class="form-control form-control-sm" [(ngModel)]="filters.email" />
          </div>
          <div class="col-sm-auto d-flex align-items-end gap-1">
            <button class="btn btn-sm btn-outline-secondary" (click)="clearFilters()">
              <i class="fas fa-rotate-left me-1"></i> Reset
            </button>
            <button type="button" class="btn btn-success btn-sm" (click)="list.get()">
              <i class="fas fa-filter me-1"></i> Apply
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card mt-2">
    <div class="card-body">
      <ngx-datatable [rows]="customers.items" [count]="customers.totalCount" [list]="list" default>
        <ngx-datatable-column name="Actions" [maxWidth]="150" [sortable]="false">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div ngbDropdown container="body">
              <button class="btn btn-sm btn-gradient dropdown-toggle" ngbDropdownToggle>
                <i class="fas fa-gear me-1"></i> Actions
              </button>
              <div ngbDropdownMenu>
                <button ngbDropdownItem (click)="editCustomer(row.id)">
                  <i class="fas fa-edit me-2 text-info"></i>Edit
                </button>
                <button ngbDropdownItem *ngIf="row.fileAttachmentId" (click)="previewFile(row.fileAttachmentId)">
                  <i class="fas fa-eye me-2 text-success"></i>Preview
                </button>
                <a ngbDropdownItem *ngIf="row.fileAttachmentId"
                  [href]="apiUrl + '/api/app/file-attachment/download/' + row.fileAttachmentId"
                  target="_blank">
                  <i class="fas fa-download me-2 text-primary"></i>Download
                </a>
                <button class="text-danger" ngbDropdownItem (click)="delete(row.id)">
                  <i class="fas fa-trash me-2"></i>Delete
                </button>
              </div>
            </div>
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column prop="name" [width]="180">
          <ng-template ngx-datatable-header-template>
            <i class="fas fa-user me-1 text-warning"></i> Name
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column prop="phone" [width]="160">
          <ng-template ngx-datatable-header-template>
            <i class="fas fa-phone me-1 text-success"></i> Phone
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column prop="email" [width]="220">
          <ng-template ngx-datatable-header-template>
            <i class="fas fa-envelope me-1 text-info"></i> Email
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column prop="address" [width]="260">
          <ng-template ngx-datatable-header-template>
            <i class="fas fa-location-dot me-1 text-danger"></i> Address
          </ng-template>
        </ngx-datatable-column>
      </ngx-datatable>
    </div>
  </div>
</abp-page>

<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <i class="fas fa-calendar-check text-success"></i>
    <h3>{{ selectedCustomer.id ? 'Edit' : 'New' }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Name *</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input class="form-control" formControlName="name" />
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Phone *</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-phone"></i></span>
            <input class="form-control" formControlName="phone" />
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Email *</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
            <input class="form-control" formControlName="email" />
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Address *</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-location-dot"></i></span>
            <input class="form-control" formControlName="address" />
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Attachment (optional)</label>
          <input type="file" class="form-control" #fileInput
            accept="image/*,.pdf,.doc,.docx"
            (change)="onFileSelected($event)" />
          <div *ngIf="selectedFile" class="mt-2 d-flex align-items-center gap-2">
            <img *ngIf="previewUrl" [src]="previewUrl"
              style="width:52px; height:52px; object-fit:cover; border-radius:8px; border:1.5px solid #ddd;" />
            <i *ngIf="!previewUrl" class="fas fa-file-alt" style="font-size:2rem; color:#147196;"></i>
            <span style="font-size:.82rem; color:#334155; flex:1;">{{ selectedFile.name }}</span>
            <button type="button" class="btn btn-sm btn-outline-danger px-2 py-0" (click)="clearFile(fileInput)">
              <i class="fas fa-xmark"></i>
            </button>
          </div>
        </div>
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button class="btn btn-outline-secondary" (click)="isModalOpen=false">
      <i class="fas fa-xmark me-1"></i> Cancel
    </button>
    <button class="btn btn-success" (click)="save()" [disabled]="form.invalid">
      <i class="fas fa-floppy-disk me-1"></i> Save
    </button>
  </ng-template>
</abp-modal>
